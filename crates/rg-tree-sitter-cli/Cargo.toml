[package]
name = "rg-tree-sitter-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "rg-tree-sitter"
path = "src/main.rs"

[dependencies]
rg-tree-sitter-core = { path = "../rg-tree-sitter-core" }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal"] }
anyhow = "1.0"
notify = "8.2"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
